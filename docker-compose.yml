services:
  db:
    image: postgres:15-alpine
    container_name: gipa_db
    restart: always
    environment:
      POSTGRES_USER: gipa_user
      POSTGRES_PASSWORD: gipa_password
      POSTGRES_DB: gipa_db
    ports:
      - "5433:5432"
    volumes:
      - gipa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gipa_user -d gipa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gipa_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gipa_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    networks:
      - gipa_net

volumes:
  gipa_postgres_data:

networks:
  gipa_net:
    driver: bridge

